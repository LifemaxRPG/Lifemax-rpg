name: Native timer engine

on:
  push:
    branches: [codex/native-timer-engine]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timer-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify fixtures against the existing JavaScript timer
        run: node lifemax_modular_v73/tests/director-timer-parity.test.js
      - name: Verify completion delivery interruption recovery
        run: |
          node lifemax_modular_v73/tests/director-completion-protocol.test.js
          node lifemax_modular_v73/tests/director-completion-plan.test.js
          node lifemax_modular_v73/tests/director-reward-adapter.test.js
          node lifemax_modular_v73/tests/director-save-fence.test.js
      - name: Compile and test the pure Kotlin timer rules
        run: |
          mkdir -p "$RUNNER_TEMP/timer-tests"
          cat > "$RUNNER_TEMP/timer-tests/settings.gradle.kts" <<'EOF'
          rootProject.name = "native-timer-rules"
          EOF
          cat > "$RUNNER_TEMP/timer-tests/build.gradle.kts" <<'EOF'
          plugins { kotlin("jvm") version "2.0.21" }
          repositories { mavenCentral() }
          dependencies {
              testImplementation("junit:junit:4.13.2")
              implementation("org.json:json:20240303")
          }
          val repo = System.getenv("GITHUB_WORKSPACE")
          kotlin { jvmToolchain(21) }
          sourceSets {
              main {
                  kotlin.srcDir("$repo/android-wrapper/native/src/main/java/com/lifemax/rpg/feature/lifedirector/domain/timer")
                  kotlin.srcDir("$repo/android-wrapper/native/src/main/java/com/lifemax/rpg/feature/lifedirector/data/timer")
              }
              test {
                  kotlin.srcDir("$repo/android-wrapper/native/src/test/java/com/lifemax/rpg/feature/lifedirector/domain/timer")
                  resources.srcDir("$repo/android-wrapper/native/src/test/resources")
              }
          }
          tasks.test { testLogging { events("passed", "failed", "skipped") } }
          EOF
          gradle -p "$RUNNER_TEMP/timer-tests" test --no-daemon --max-workers=2
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-timer-test-results
          path: ${{ runner.temp }}/timer-tests/build/reports/tests/test

  android-timer-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android compilation
        working-directory: android-wrapper
        run: |
          mkdir -p www
          printf '%s' '<!doctype html><title>Timer compile check</title>' > www/index.html
          npm install
          npx cap add android
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          cp native/*.java android/app/src/main/java/com/lifemax/rpg/
          python3 patch_project.py android
          cp -r res/. android/app/src/main/res/
          python3 patch_gradle.py android/app/build.gradle 1 0
          python3 patch_styles.py android/app/src/main/res/values/styles.xml
          npx cap sync android
      - name: Compile Android plugin and app sources
        working-directory: android-wrapper/android
        run: ./gradlew --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' :app:assembleDebug --stacktrace

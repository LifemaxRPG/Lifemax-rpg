name: Native timer engine

on:
  push:
    branches: [codex/native-timer-engine]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timer-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify fixtures against the existing JavaScript timer
        run: node lifemax_modular_v73/tests/director-timer-parity.test.js
      - name: Verify completion delivery interruption recovery
        run: |
          node lifemax_modular_v73/tests/director-completion-protocol.test.js
          node lifemax_modular_v73/tests/director-completion-plan.test.js
          node lifemax_modular_v73/tests/director-reward-adapter.test.js
      - name: Compile and test the pure Kotlin timer rules
        run: |
          mkdir -p "$RUNNER_TEMP/timer-tests"
          cat > "$RUNNER_TEMP/timer-tests/settings.gradle.kts" <<'EOF'
          rootProject.name = "native-timer-rules"
          EOF
          cat > "$RUNNER_TEMP/timer-tests/build.gradle.kts" <<'EOF'
          plugins { kotlin("jvm") version "2.0.21" }
          repositories { mavenCentral() }
          dependencies {
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.json:json:20240303")
          }
          val repo = System.getenv("GITHUB_WORKSPACE")
          kotlin { jvmToolchain(21) }
          sourceSets {
              main {
                  kotlin.srcDir("$repo/android-wrapper/native/src/main/java/com/lifemax/rpg/feature/lifedirector/domain/timer")
                  kotlin.srcDir("$repo/android-wrapper/native/src/main/java/com/lifemax/rpg/feature/lifedirector/data/timer")
              }
              test {
                  kotlin.srcDir("$repo/android-wrapper/native/src/test/java/com/lifemax/rpg/feature/lifedirector/domain/timer")
                  resources.srcDir("$repo/android-wrapper/native/src/test/resources")
              }
          }
          tasks.test { testLogging { events("passed", "failed", "skipped") } }
          EOF
          gradle -p "$RUNNER_TEMP/timer-tests" test --no-daemon --max-workers=2
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-timer-test-results
          path: ${{ runner.temp }}/timer-tests/build/reports/tests/test

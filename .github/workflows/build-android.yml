name: Build Android APK

on:
  push:
    branches: [main, claude/github-android-app-d3wlth, codex/native-overview, codex/native-character, codex/native-food-parity, codex/native-tab-switch-performance]
    # a push that only touches documentation builds nothing, so it cannot cancel a build in progress
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      stable: ${{ steps.key.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check native Kotlin formatting
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 https://repo.maven.apache.org/maven2/com/facebook/ktfmt/0.53/ktfmt-0.53-jar-with-dependencies.jar -o "$RUNNER_TEMP/ktfmt.jar"
          printf '%s  %s\n' '76d05c614fe1864788557170fe89410f75134866a9f84011f9bd570ca12526b1' "$RUNNER_TEMP/ktfmt.jar" | sha256sum --check
          python3 tools/check_native_format.py "$RUNNER_TEMP/ktfmt.jar"

      - name: Copy newest single-file build into the web folder
        run: |
          mkdir -p android-wrapper/www
          python3 lifemax_modular_v73/build.py
          python3 lifemax_modular_v73/forge_features.py lifemax_modular_v73/dist/Life_Max_RPG_v73_modular_build.html android-wrapper/www/index.html

      - name: Prepare the permanent signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android-wrapper/lifemax.p12
            echo "stable=1" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF" = refs/heads/claude/github-android-app-d3wlth ]; then
            # a release signed with a throwaway key could not update the installed app, so it is never published
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; a release branch build must be signed with the permanent key. See ANDROID.md."
            exit 1
          else
            echo "stable=0" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing, so this build is signed with a throwaway key and cannot update an installed copy. See ANDROID.md."
          fi

      - name: Create Android project
        working-directory: android-wrapper
        run: |
          npm install
          npx cap add android
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          cp native/*.java android/app/src/main/java/com/lifemax/rpg/
          python3 patch_project.py android
          mkdir -p android/app/src/androidTest/java/com/lifemax/rpg
          rm -rf android/app/src/androidTest/java/com/getcapacitor
          cp android-test/*.kt android/app/src/androidTest/java/com/lifemax/rpg/
          cp -r res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp res/drawable/splash.png {} \;
          [ -f lifemax.p12 ] && cp lifemax.p12 android/app/lifemax.p12 || true
          python3 patch_gradle.py android/app/build.gradle "${{ github.run_number }}" "${{ steps.key.outputs.stable }}"
          python3 patch_styles.py android/app/src/main/res/values/styles.xml
          npx cap sync android
          echo "--- launcher resources ---"; find android/app/src/main/res -name 'ic_launcher*' | sort
          echo "--- styles.xml ---"; cat android/app/src/main/res/values/styles.xml

      - name: Guard - native changes must bump NativeApi
        run: |
          # If the Android side changed since the last published build, the web app must not be offered as a quiet update to older APKs:
          # NativeApi.VALUE has to go up so the update check sends phones to the new APK instead.
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/latest"
          if curl -fsSL "$BASE/version.json" -o prev.json; then
            PREV_SHA=$(python3 -c "import json;print(json.load(open('prev.json')).get('sha',''))")
            PREV_API=$(python3 -c "import json;print(json.load(open('prev.json')).get('nativeApi',0))")
            NOW_API=$(grep -o 'VALUE = [0-9]*' android-wrapper/native/NativeApi.java | grep -o '[0-9]*')
            if [ -n "$PREV_SHA" ] && git cat-file -e "$PREV_SHA^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$PREV_SHA" HEAD -- android-wrapper/native ':(exclude)android-wrapper/native/src/test' android-wrapper/res android-wrapper/patch_manifest.py android-wrapper/patch_gradle.py android-wrapper/patch_project.py android-wrapper/patch_styles.py | grep -v 'NativeApi.java' || true)
              echo "previous build $PREV_SHA had nativeApi $PREV_API; now $NOW_API"
              if [ -n "$CHANGED" ] && [ "$NOW_API" -le "$PREV_API" ]; then
                echo "::error::The Android side changed but NativeApi.VALUE was not raised (still $NOW_API). Raise it in android-wrapper/native/NativeApi.java so phones are offered the new APK. Changed: $CHANGED"
                exit 1
              fi
            fi
          fi

      - name: Build debug APK
        working-directory: android-wrapper/android
        run: ./gradlew assembleDebug verifyPaparazziDebug

      - name: Keep the screenshot report when a native screen changed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Native-screenshots
          path: |
            android-wrapper/android/app/build/reports/paparazzi/
            android-wrapper/android/app/build/paparazzi/failures/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: LifeMax-RPG-apk
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release build daemon before starting the emulator
        if: (github.ref == 'refs/heads/codex/native-overview' || github.ref == 'refs/heads/codex/native-character' || github.ref == 'refs/heads/codex/native-food-parity' || github.ref == 'refs/heads/codex/native-tab-switch-performance')
        run: ./android-wrapper/android/gradlew -p android-wrapper/android --stop

      - name: Enable emulator acceleration
        if: (github.ref == 'refs/heads/codex/native-overview' || github.ref == 'refs/heads/codex/native-character' || github.ref == 'refs/heads/codex/native-food-parity' || github.ref == 'refs/heads/codex/native-tab-switch-performance')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify native Overview against the original Android page
        if: (github.ref == 'refs/heads/codex/native-overview' || github.ref == 'refs/heads/codex/native-character' || github.ref == 'refs/heads/codex/native-food-parity' || github.ref == 'refs/heads/codex/native-tab-switch-performance')
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          ram-size: 3072M
          heap-size: 384M
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 android-wrapper/verify_overview.py

      - uses: actions/upload-artifact@v4
        if: always() && (github.ref == 'refs/heads/codex/native-overview' || github.ref == 'refs/heads/codex/native-character' || github.ref == 'refs/heads/codex/native-food-parity' || github.ref == 'refs/heads/codex/native-tab-switch-performance')
        with:
          name: Native-Overview-review
          path: |
            native-overview-review/
            android-wrapper/android/app/build/reports/androidTests/
            android-wrapper/android/app/build/outputs/androidTest-results/

      - name: Show the signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true

      # Before a release: the APK must launch on an emulator and keep running (blocking). The tab-switch timing check after it
      # never fails the build; read its result in the Native-Overview-review artifact (nav-perf.json).
      - name: Release build daemon before the emulator
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/github-android-app-d3wlth'
        run: ./android-wrapper/android/gradlew -p android-wrapper/android --stop

      - name: Enable emulator acceleration for the launch check
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/github-android-app-d3wlth'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch check, then the optional tab-switch timing
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/github-android-app-d3wlth'
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          ram-size: 3072M
          heap-size: 384M
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash android-wrapper/smoke_launch.sh && { python3 android-wrapper/verify_overview.py || echo "::warning::The optional tab-switch timing check failed; see the Native-Overview-review artifact."; }

      - uses: actions/upload-artifact@v4
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/github-android-app-d3wlth')
        continue-on-error: true
        with:
          name: Native-Overview-review
          path: |
            native-overview-review/
            android-wrapper/android/app/build/reports/androidTests/
            android-wrapper/android/app/build/outputs/androidTest-results/

  # Every web test and the hand-over simulation, on their own runner in parallel with the APK build.
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium

      - name: Install Playwright
        run: |
          npm install -g playwright@1.63.0
          npx playwright@1.63.0 install --with-deps chromium

      - name: JavaScript lint ratchet
        run: python3 lifemax_modular_v73/tools/lint_js.py

      - name: Every native plugin registered and catalogued
        run: python3 tools/check_bridge_catalog.py

      - name: Web tests (everything not listed in tests/SKIP_IN_CI.txt)
        run: lifemax_modular_v73/tools/run_tests.sh

      - name: Tab hand-over simulation
        run: SEEDS=40 lifemax_modular_v73/tools/run_tests.sh sim

  # Only a build whose APK compiled, passed its unit and screenshot tests and whose web tests passed reaches the phone.
  publish:
    needs: [apk, web-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/github-android-app-d3wlth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: LifeMax-RPG-apk
          path: apk

      - name: Publish to a GitHub Release (easy phone download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apk/app-debug.apk LifeMax-RPG.apk
          # the web app on its own, so a phone can take web-only changes without installing an APK
          NATIVE_API=$(grep -o 'VALUE = [0-9]*' android-wrapper/native/NativeApi.java | grep -o '[0-9]*')
          python3 lifemax_modular_v73/build.py >/dev/null
          python3 lifemax_modular_v73/forge_features.py lifemax_modular_v73/dist/Life_Max_RPG_v73_modular_build.html app.html
          WEB_SHA=$(sha256sum app.html | cut -d' ' -f1)
          WEB_SIZE=$(stat -c %s app.html)
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/latest"
          printf '{"build": %s, "sha": "%s", "stable": %s, "nativeApi": %s, "apk": "%s/LifeMax-RPG.apk", "web": {"build": %s, "url": "%s/app.html", "sha256": "%s", "size": %s, "minNativeApi": %s}}\n' \
            "${{ github.run_number }}" "$GITHUB_SHA" "${{ needs.apk.outputs.stable == '1' }}" "$NATIVE_API" "$BASE" \
            "${{ github.run_number }}" "$BASE" "$WEB_SHA" "$WEB_SIZE" "$NATIVE_API" > version.json
          cat version.json
          NOTES="Build ${{ github.run_number }} from commit $GITHUB_SHA"
          if gh release download latest --repo "$GITHUB_REPOSITORY" --dir prev --pattern LifeMax-RPG.apk --pattern version.json; then
            # the build being replaced stays downloadable as "previous", in case the new one misbehaves on the phone
            PREV_SHA=$(python3 -c "import json;print(json.load(open('prev/version.json')).get('sha',''))")
            gh release delete previous --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
            gh release create previous prev/LifeMax-RPG.apk prev/version.json --repo "$GITHUB_REPOSITORY" --latest=false \
              --title "LifeMax (previous build)" --notes "The build before latest (commit $PREV_SHA). Install it if the latest build misbehaves." \
              ${PREV_SHA:+--target "$PREV_SHA"}
            # replace the files in place, never deleting the release; version.json goes last, so a phone checking part-way
            # through still sees a matching set (an older version.json with a newer app.html fails its hash check and is retried)
            git push --force origin "$GITHUB_SHA:refs/tags/latest"
            gh release upload latest LifeMax-RPG.apk app.html --clobber --repo "$GITHUB_REPOSITORY"
            gh release upload latest version.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest LifeMax-RPG.apk app.html version.json --repo "$GITHUB_REPOSITORY" \
              --title "LifeMax (latest build)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
